# Actualizaciones automáticas de dependencias (PRs semanales).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /code/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
