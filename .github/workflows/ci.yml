name: CI

on:
  pull_request:
  push:
    branches: ["**"]

# Evita colas innecesarias: un push nuevo cancela el CI anterior en la misma rama.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            code/backend/requirements.txt
            code/backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint backend (ruff)
        run: python -m ruff check .

      - name: Type-check backend (mypy)
        run: python -m mypy --config-file ../../pyproject.toml

      - name: Validate Alembic migrations
        run: DATABASE_URL=sqlite:///./ci_migration.db python -m alembic upgrade head

      - name: Run backend unit tests (pytest)
        run: PYTHONPATH=. python -m pytest -q

  backend-docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build API Docker image
        run: docker build -t elvir-api:ci ./code/backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      - name: Verify frontend lockfile alignment
        run: python3 ../../scripts/check_frontend_lock_sync.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build -- --configuration development
