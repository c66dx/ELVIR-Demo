name: CI

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint backend (ruff)
        run: python -m ruff check .

      - name: Type-check backend (mypy)
        run: python -m mypy --config-file ../../pyproject.toml


      - name: Validate Alembic migrations
        run: DATABASE_URL=sqlite:///./ci_migration.db python -m alembic upgrade head

      - name: Run backend unit tests (pytest)
        run: PYTHONPATH=. python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/frontend/package-lock.json

      - name: Verify frontend lockfile alignment
        run: python3 ../../scripts/check_frontend_lock_sync.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build -- --configuration development
