# Stack local ELVIR: PostgreSQL + API FastAPI
#
# Solo Postgres (como antes):
#   docker compose up -d postgres
#
# API + Postgres (misma red; la app usa el hostname `postgres`):
#   docker compose up -d --build
#   API: http://localhost:8000  |  docs: http://localhost:8000/docs
#
# Variables: code/backend/.env se monta en el servicio `api` (p. ej. LIVEAVATAR_*).
# DATABASE_URL dentro del contenedor la fija `environment` (host `postgres`).
# Si falta el fichero, crea uno desde code/backend/.env.example antes de `docker compose up`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: elvir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elvir
      POSTGRES_PASSWORD: elvir
      POSTGRES_DB: elvir
    ports:
      - "5432:5432"
    volumes:
      - elvir_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elvir -d elvir"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./code/backend
      dockerfile: Dockerfile
    container_name: elvir-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Carga LIVEAVATAR_*, SECRET_KEY opcional, etc. Las claves repetidas en `environment` ganan
    # (p. ej. DATABASE_URL debe seguir apuntando al hostname `postgres`, no a localhost).
    env_file:
      - ./code/backend/.env
    environment:
      DATABASE_URL: postgresql://elvir:elvir@postgres:5432/elvir
      ENV: dev
      SECRET_KEY: elvir-dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:8000
      APP_BASE_URL: http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
    # Volumen nombrado: el entrypoint ajusta permisos de /app/uploads (ver docker-entrypoint.sh).
    # Tras cambiar el entrypoint: docker compose build api --no-cache && docker compose up -d api
    volumes:
      - elvir_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  elvir_postgres_data:
  elvir_uploads:
