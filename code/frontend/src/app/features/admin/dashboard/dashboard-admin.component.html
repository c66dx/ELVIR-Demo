<div class="dashboard">
  <header class="dashboard-header page-header">
    <h2>Panel de Administración</h2>
  </header>

  <div class="admin-actions">
    <a routerLink="/admin/profesionales" class="action-card">
      <span class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </span>
      <span class="action-title">Profesionales</span>
      <span class="action-desc">Ver lista y crear nuevos profesionales</span>
    </a>
    <a routerLink="/admin/usuarios" class="action-card">
      <span class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 11.5a3.5 3.5 0 1 1-6.6-1.6"/>
          <line x1="22" y1="11.5" x2="19" y2="11.5"/>
        </svg>
      </span>
      <span class="action-title">Usuarios y logs</span>
      <span class="action-desc">Ver jóvenes y profesionales con últimos accesos</span>
    </a>
    <a routerLink="/admin/material/nuevo" class="action-card">
      <span class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </span>
      <span class="action-title">Crear material</span>
      <span class="action-desc">Agregar material de apoyo general (visible para todos)</span>
    </a>
  </div>
</div>
