<div class="form-page">
  <div class="page-header">
    <h2>Cambiar contraseña</h2>
    <a routerLink="/" class="btn-link">← Volver</a>
  </div>

  <p class="change-password-intro">Ingresa tu contraseña actual y la nueva contraseña que deseas usar.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="current_password">Contraseña actual *</label>
      <input
        id="current_password"
        type="password"
        formControlName="current_password"
        placeholder="Tu contraseña actual"
        autocomplete="current-password"
      />
    </div>
    <div class="field">
      <label for="new_password">Nueva contraseña *</label>
      <input
        id="new_password"
        type="password"
        formControlName="new_password"
        placeholder="Mínimo 6 caracteres"
        autocomplete="new-password"
      />
    </div>
    <div class="field">
      <label for="new_password_confirm">Confirmar nueva contraseña *</label>
      <input
        id="new_password_confirm"
        type="password"
        formControlName="new_password_confirm"
        placeholder="Repite la nueva contraseña"
        autocomplete="new-password"
      />
      @if (form.get('new_password_confirm')?.hasError('mismatch')) {
        <span class="field-error">Las contraseñas no coinciden</span>
      }
    </div>
    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }
    <div class="form-actions actions">
      <button type="submit" [disabled]="form.invalid || submitting" class="btn-primary">Cambiar contraseña</button>
      <a routerLink="/" class="btn-link">Cancelar</a>
    </div>
  </form>
</div>
