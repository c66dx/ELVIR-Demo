<app-form-container
  title="Mi perfil"
  subtitle="Administra tu foto de perfil y tus credenciales de acceso."
>
  <a form-header-actions routerLink="/" class="btn-link">← Volver</a>

  <form class="form-layout" [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-form-section title="Perfil" description="Tu información principal y foto de perfil.">
      <div class="profile-row">
        <div class="avatar" [class.avatar--image]="photoUrl()">
          @if (photoUrl()) {
            <img [src]="photoUrl()!" alt="Foto de perfil" />
          } @else {
            <span>{{ initials() }}</span>
          }
        </div>

        <div class="profile-info">
          <div class="profile-name">{{ me()?.email || 'Administrador' }}</div>
          <div class="profile-meta">{{ roleLabel() }}</div>
        </div>

        <label class="btn-secondary btn-sm btn-file">
          {{ photoLoading() ? 'Subiendo...' : 'Actualizar foto' }}
          <input
            type="file"
            accept="image/png,image/jpeg,image/webp"
            (change)="onPhotoSelected($event)"
            [disabled]="photoLoading()"
          />
        </label>
      </div>

      @if (photoError()) {
        <p class="profile-error">{{ photoError() }}</p>
      }
    </app-form-section>

    <app-form-section title="Seguridad" description="Actualiza tus credenciales de acceso.">
      <app-form-grid [columns]="1">
        <app-form-field label="Contraseña actual" forId="current_password" [required]="true">
          <app-text-input
            id="current_password"
            type="password"
            formControlName="current_password"
            placeholder="Tu contraseña actual"
            autocomplete="current-password"
          ></app-text-input>
        </app-form-field>

        <app-form-field
          label="Nueva contraseña"
          forId="new_password"
          [required]="true"
          hint="Mínimo 6 caracteres"
        >
          <app-text-input
            id="new_password"
            type="password"
            formControlName="new_password"
            placeholder="Nueva contraseña"
            autocomplete="new-password"
          ></app-text-input>
        </app-form-field>

        <app-form-field
          label="Confirmar nueva contraseña"
          forId="new_password_confirm"
          [required]="true"
          [error]="form.get('new_password_confirm')?.hasError('mismatch') ? 'Las contraseñas no coinciden' : null"
        >
          <app-text-input
            id="new_password_confirm"
            type="password"
            formControlName="new_password_confirm"
            placeholder="Repite la nueva contraseña"
            autocomplete="new-password"
          ></app-text-input>
        </app-form-field>
      </app-form-grid>

      @if (errorMessage) {
        <div class="form-error-banner" role="alert">{{ errorMessage }}</div>
      }
    </app-form-section>

    <app-form-actions [sticky]="false">
      <button type="submit" [disabled]="form.invalid || submitting" class="btn-primary">Cambiar contraseña</button>
      <a routerLink="/" class="btn-secondary">Cancelar</a>
    </app-form-actions>
  </form>
</app-form-container>
