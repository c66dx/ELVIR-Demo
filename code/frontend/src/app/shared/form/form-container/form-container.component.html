@if (title || subtitle) {
  <div class="page-header">
    <div>
      @if (title) {
        <h2>{{ title }}</h2>
      }
      @if (subtitle) {
        <p class="page-subtitle">{{ subtitle }}</p>
      }
    </div>
    <ng-content select="[form-header-actions]"></ng-content>
  </div>
}

<ng-content></ng-content>
