<div class="app-shell">
  <aside class="sidebar" [class.sidebar--collapsed]="isSidebarCollapsed" aria-label="Navegacion principal">
    <app-sidebar [collapsed]="isSidebarCollapsed" (toggleCollapsed)="toggleSidebar()"></app-sidebar>
  </aside>
  <div class="app-main">
    <main id="main-content" class="content" tabindex="-1" aria-label="Contenido principal">
      <div class="content-inner">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
